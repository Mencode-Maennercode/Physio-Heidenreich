<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 420 64" width="420" height="64">
  <title>Nora Heidenreich – Mobile Physiotherapie</title>
  <!--
    Für Druck und fremde Programme: Die Schriften müssen auf dem Rechner
    installiert sein, sonst wird eine Ersatzschrift verwendet. Beide sind
    kostenlos bei Google Fonts erhältlich:
      Instrument Serif  (Wortmarke)
      Inter             (Zusatzzeile)
